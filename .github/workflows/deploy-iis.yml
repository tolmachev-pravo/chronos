name: Deploy to IIS (Self-Hosted)

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to deploy, for example v1.6.0 (drafts have no downloadable asset)'
        required: true
        type: string

# two deployments must never touch the site at the same time
concurrency:
  group: deploy-iis
  cancel-in-progress: false

jobs:
  deploy:
    # pre-releases are published for testing and must not reach production on their own
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: self-hosted

    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      APP_POOL: _jira.copilot
      SITE_PATH: F:\inetpub\sites\jira.copilot

    steps:
    # No checkout and no build: the site is deployed from the artifact the Release
    # workflow built and tested on the tag, so production matches a known release.
    #
    # Keep every powershell step ASCII-only. The runner writes the step to a UTF-8 file
    # without a BOM and Windows PowerShell reads it in the system codepage, so a non-ASCII
    # character arrives mangled and can break parsing before a single line runs.
    - name: Download and unpack the release artifact
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        # Two names are tried in turn. The rename to Chronos (issue #226) changed the asset
        # name, but releases published before it keep the old one forever, so deploying or
        # rolling back to an older tag has to still find its archive.
        $candidates = @(
            "chronos-$env:RELEASE_TAG.zip",
            "pet-jira-copilot-$env:RELEASE_TAG.zip"
        )
        $unpacked = Join-Path $env:RUNNER_TEMP "release"
        $archive = $null

        foreach ($asset in $candidates) {
            $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$asset"
            $target = Join-Path $env:RUNNER_TEMP $asset
            Write-Host "Trying $url"
            try {
                Invoke-WebRequest -Uri $url -OutFile $target -UseBasicParsing
                $archive = $target
                Write-Host "Downloaded $asset"
                break
            } catch {
                Write-Host "Not available under this name: $($_.Exception.Message)"
            }
        }

        if (-not $archive) {
            throw "Cannot download the release archive for $env:RELEASE_TAG under any known asset name. The release has to be published and built by the Release workflow: a draft keeps its asset private and older releases carry none."
        }

        if (Test-Path $unpacked) { Remove-Item $unpacked -Recurse -Force }
        Expand-Archive -Path $archive -DestinationPath $unpacked -Force

        # fail here, while the site is still untouched, rather than half way through the copy
        if (-not (Test-Path (Join-Path $unpacked 'Chronos.Web.dll'))) {
            throw "The unpacked artifact contains no Chronos.Web.dll, refusing to deploy."
        }

        Write-Host "Deploying $env:RELEASE_TAG to $env:SITE_PATH"

    - name: Stop AppPool (if running)
      shell: powershell
      run: |
        Import-Module WebAdministration
        if ((Get-WebAppPoolState -Name $env:APP_POOL).Value -eq "Started") {
            Stop-WebAppPool -Name $env:APP_POOL
        }

    - name: Copy files (keep the appsettings living on the server)
      shell: powershell
      run: |
        $source = Join-Path $env:RUNNER_TEMP "release"
        robocopy $source $env:SITE_PATH /E /ZB /XF "appsettings.json" "appsettings.*.json" /W:1 /R:3 /NP
        # robocopy reports success with any code below 8
        if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = $null }

    - name: Start AppPool
      if: always() # the site has to come back up even when the copy failed
      shell: powershell
      run: |
        Import-Module WebAdministration
        if ((Get-WebAppPoolState -Name $env:APP_POOL).Value -ne "Started") {
            Start-WebAppPool -Name $env:APP_POOL
        }

    # Set the SITE_URL repository variable to turn this on, for example https://jira.copilot
    - name: Smoke check the deployed site
      if: vars.SITE_URL != ''
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $url = "${{ vars.SITE_URL }}".TrimEnd('/') + "/health"

        for ($attempt = 1; $attempt -le 10; $attempt++) {
            try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
                Write-Host "$url answered $($response.StatusCode) on attempt $attempt"
                exit 0
            } catch {
                Write-Host "Attempt ${attempt}: $($_.Exception.Message)"
                Start-Sleep -Seconds 6
            }
        }

        throw "$url did not answer after the deployment of $env:RELEASE_TAG."
