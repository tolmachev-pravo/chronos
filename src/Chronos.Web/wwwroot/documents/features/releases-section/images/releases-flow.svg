<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Theme-safe panel so it reads on light and dark backgrounds -->
  <rect x="8" y="8" width="704" height="314" rx="16" fill="#F7F8FA" stroke="#E4E7EE"/>

  <!-- ── Source: GitHub Releases ─────────────────────────────── -->
  <g>
    <rect x="40" y="96" width="196" height="150" rx="12" fill="#FFFFFF" stroke="#E4E7EE"/>
    <!-- GitHub mark -->
    <circle cx="66" cy="126" r="13" fill="#1F2430"/>
    <circle cx="66" cy="126" r="4.5" fill="#FFFFFF"/>
    <text x="88" y="122" font-size="15" font-weight="700" fill="#1F2430">GitHub</text>
    <text x="88" y="139" font-size="11.5" fill="#8A93A6">Releases API</text>

    <!-- release tags -->
    <g>
      <rect x="60" y="160" width="72" height="26" rx="8" fill="#EFEAFB"/>
      <text x="96" y="177" font-size="12" font-weight="700" fill="#8260E5" text-anchor="middle">v1.5.0</text>
      <rect x="60" y="196" width="72" height="26" rx="8" fill="#EFEAFB"/>
      <text x="96" y="213" font-size="12" font-weight="700" fill="#8260E5" text-anchor="middle">v1.4.0</text>
    </g>
    <text x="152" y="178" font-size="11.5" fill="#8A93A6">release</text>
    <text x="152" y="214" font-size="11.5" fill="#8A93A6">notes…</text>
  </g>

  <!-- ── Arrow ───────────────────────────────────────────────── -->
  <g>
    <text x="288" y="158" font-size="11.5" font-weight="600" fill="#8A93A6" text-anchor="middle">HTTPS</text>
    <line x1="248" y1="171" x2="300" y2="171" stroke="#8260E5" stroke-width="2.5"/>
    <path d="M300 171 l-11 -6 v12 z" fill="#8260E5"/>
  </g>

  <!-- ── App: Releases section ───────────────────────────────── -->
  <g>
    <rect x="320" y="60" width="360" height="222" rx="14" fill="#FFFFFF" stroke="#E4E7EE"/>
    <text x="344" y="92" font-size="16" font-weight="700" fill="#1F2430">Releases</text>
    <text x="344" y="110" font-size="11.5" fill="#8A93A6">История релизов приложения</text>
    <line x1="344" y1="122" x2="656" y2="122" stroke="#EEF0F4" stroke-width="1"/>

    <!-- release card 1 -->
    <g>
      <rect x="344" y="136" width="312" height="60" rx="10" fill="#FBFBFD" stroke="#E9ECF2"/>
      <text x="360" y="160" font-size="13" font-weight="700" fill="#1F2430">Быстрая загрузка ворклогов</text>
      <rect x="360" y="170" width="58" height="18" rx="6" fill="#EFEAFB"/>
      <text x="389" y="183" font-size="10" font-weight="700" fill="#8260E5" text-anchor="middle">v1.5.0</text>
      <text x="430" y="183" font-size="10.5" fill="#8A93A6">16.07.2026</text>
      <text x="600" y="183" font-size="10.5" font-weight="600" fill="#8260E5">GitHub ↗</text>
    </g>

    <!-- release card 2 -->
    <g>
      <rect x="344" y="206" width="312" height="60" rx="10" fill="#FBFBFD" stroke="#E9ECF2"/>
      <text x="360" y="230" font-size="13" font-weight="700" fill="#1F2430">Раздел «Features»</text>
      <rect x="360" y="240" width="58" height="18" rx="6" fill="#EFEAFB"/>
      <text x="389" y="253" font-size="10" font-weight="700" fill="#8260E5" text-anchor="middle">v1.4.0</text>
      <text x="430" y="253" font-size="10.5" fill="#8A93A6">30.06.2026</text>
      <text x="600" y="253" font-size="10.5" font-weight="600" fill="#8260E5">GitHub ↗</text>
    </g>
  </g>

  <!-- caption -->
  <text x="360" y="310" font-size="12" fill="#8A93A6" text-anchor="middle">Релизы с GitHub — прямо в приложении, с кэшем и ссылкой-запасным вариантом</text>
</svg>
