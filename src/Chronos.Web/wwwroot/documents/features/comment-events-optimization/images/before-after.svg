    <rect x="54" y="160" width="20" height="20" rx="4"/>
    <rect x="80" y="160" width="20" height="20" rx="4"/>
    <rect x="106" y="160" width="20" height="20" rx="4"/>
    <rect x="158" y="160" width="20" height="20" rx="4"/>
    <rect x="184" y="160" width="20" height="20" rx="4"/>
    <rect x="210" y="160" width="20" height="20" rx="4"/>
    <rect x="28" y="186" width="20" height="20" rx="4"/>
    <rect x="54" y="186" width="20" height="20" rx="4"/>
    <rect x="80" y="186" width="20" height="20" rx="4"/>
    <rect x="106" y="186" width="20" height="20" rx="4"/>
    <rect x="132" y="186" width="20" height="20" rx="4"/>
    <rect x="158" y="186" width="20" height="20" rx="4"/>
    <rect x="184" y="186" width="20" height="20" rx="4"/>
    <rect x="210" y="186" width="20" height="20" rx="4"/>
    <rect x="28" y="212" width="20" height="20" rx="4"/>
    <rect x="54" y="212" width="20" height="20" rx="4"/>
    <rect x="80" y="212" width="20" height="20" rx="4"/>
    <rect x="132" y="212" width="20" height="20" rx="4"/>
    <rect x="158" y="212" width="20" height="20" rx="4"/>
    <rect x="184" y="212" width="20" height="20" rx="4"/>
    <rect x="210" y="212" width="20" height="20" rx="4"/>
