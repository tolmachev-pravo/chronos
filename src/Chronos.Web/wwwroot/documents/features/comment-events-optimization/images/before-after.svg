<svg viewBox="0 0 720 366" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="8" y="8" width="704" height="350" rx="16" fill="#F7F8FA" stroke="#E4E7EE" stroke-width="1.5"/>

  <text x="28" y="40" font-size="17" font-weight="700" fill="#1F2430">Какие задачи Jira возвращает для событий по комментариям</text>

  <line x1="360" y1="58" x2="360" y2="300" stroke="#E4E7EE" stroke-width="1.5"/>

  <!-- Before -->
  <text x="28" y="80" font-size="14" font-weight="700" fill="#8A93A6">Было</text>
  <text x="28" y="102" font-size="12" fill="#8A93A6">Все задачи, обновлённые с начала периода,</text>
  <text x="28" y="118" font-size="12" fill="#8A93A6">на которые вы подписаны</text>

  <g fill="#D3D8E3">
    <rect x="28" y="134" width="20" height="20" rx="4"/>
    <rect x="54" y="134" width="20" height="20" rx="4"/>
