<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- self-contained figure background so it reads on light and dark themes -->
  <rect x="10" y="10" width="740" height="340" rx="18" fill="#F7F8FA" stroke="#E4E7EE"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8260E5"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A6"/>
    </marker>
  </defs>

  <!-- ===== Image registry ===== -->
  <rect x="540" y="36" width="190" height="78" rx="14" fill="#FFFFFF" stroke="#E4E7EE"/>
  <text x="560" y="64" fill="#8A93A6" font-size="12" font-weight="600" letter-spacing="1">ОБРАЗ РЕЛИЗА</text>
  <text x="560" y="90" fill="#1F2430" font-size="15" font-weight="700">ghcr.io · chronos</text>

  <line x1="635" y1="114" x2="635" y2="152" stroke="#8A93A6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="625" y="138" fill="#8A93A6" font-size="12" text-anchor="end">docker compose pull</text>

  <!-- ===== Browser ===== -->
  <rect x="34" y="172" width="170" height="96" rx="14" fill="#FFFFFF" stroke="#E4E7EE"/>
  <rect x="54" y="192" width="40" height="30" rx="6" fill="#ECE7FB" stroke="#8260E5"/>
  <line x1="54" y1="201" x2="94" y2="201" stroke="#8260E5"/>
  <text x="54" y="246" fill="#1F2430" font-size="16" font-weight="700">Браузер</text>

  <line x1="204" y1="220" x2="282" y2="220" stroke="#8260E5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="243" y="210" fill="#8260E5" font-size="12" font-weight="600" text-anchor="middle">HTTPS</text>

  <!-- ===== Shared entry nginx ===== -->
  <rect x="286" y="172" width="180" height="96" rx="14" fill="#FFFFFF" stroke="#E4E7EE"/>
  <text x="306" y="200" fill="#8A93A6" font-size="12" font-weight="600" letter-spacing="1">ВХОД СЕРВЕРА</text>
  <text x="306" y="226" fill="#1F2430" font-size="16" font-weight="700">nginx</text>
  <text x="306" y="250" fill="#8A93A6" font-size="12">хост → приложение</text>

  <line x1="466" y1="220" x2="536" y2="220" stroke="#8260E5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="501" y="210" fill="#8260E5" font-size="12" font-weight="600" text-anchor="middle">HTTP</text>

  <!-- ===== Chronos container ===== -->
  <rect x="540" y="156" width="190" height="170" rx="14" fill="#FFFFFF" stroke="#8260E5" stroke-width="1.5"/>
  <text x="560" y="184" fill="#8A93A6" font-size="12" font-weight="600" letter-spacing="1">КОНТЕЙНЕР</text>
  <text x="560" y="210" fill="#1F2430" font-size="17" font-weight="700">Chronos</text>
  <text x="560" y="230" fill="#8A93A6" font-size="12">порт 8080</text>

  <!-- data volume -->
  <rect x="560" y="246" width="150" height="62" rx="10" fill="#E6F8F4" stroke="#1FC8A5"/>
  <text x="574" y="268" fill="#1F2430" font-size="14" font-weight="700">том /data</text>
  <text x="574" y="290" fill="#1F2430" font-size="12">база · ключи · логи</text>

  <!-- other apps on the same entry -->
  <line x1="376" y1="268" x2="376" y2="300" stroke="#8A93A6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="376" y="322" fill="#8A93A6" font-size="12" text-anchor="middle">другие приложения сервера</text>
</svg>
