<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="260" height="260" role="img" aria-label="Chronos">
    <!--
        Chronos logo for the HealthChecks UI dashboard (issue #226). Wired up as the logoImageUrl
        custom property in wwwroot/css/dotnet.css, which the health checks endpoint pulls in
        from Startup.cs.

        No background: the dashboard puts this on its purple aside (bgAside, #68217a), so the mark
        is drawn in white. That is also why the colours are literal rather than currentColor — an
        SVG referenced from a CSS url() is an isolated document and inherits nothing from the page.

        Note for editors: this is XML, so a comment may not contain a double hyphen. Write CSS
        custom property names without their leading dashes or the whole file fails to parse.

        Geometry matches images/favicon/favicon.svg; keep the two in step. Replaces a 260x260 PNG
        that used to be base64-embedded in an SVG wrapper, so this is now genuinely vector.
    -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#FFFFFF" stroke-width="8" />
    <line x1="50" y1="50" x2="50" y2="34" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"
          transform="rotate(-60 50 50)" />
    <line x1="50" y1="50" x2="50" y2="24" stroke="#E3A93B" stroke-width="8" stroke-linecap="round"
          transform="rotate(60 50 50)" />
    <circle cx="50" cy="50" r="5" fill="#E3A93B" />
</svg>
