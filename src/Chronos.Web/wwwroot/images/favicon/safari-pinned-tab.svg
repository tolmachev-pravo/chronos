<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="260" height="260" role="img" aria-label="Chronos">
    <!--
        Safari pinned-tab mask icon (issue #226). Safari takes only the silhouette and recolours it,
        so this variant is a single flat black layer on a transparent background — no gold accent
        and no background plate, both of which would be discarded anyway.

        Geometry matches images/favicon/favicon.svg; keep the two in step.
    -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#000000" stroke-width="8" />
    <line x1="50" y1="50" x2="50" y2="34" stroke="#000000" stroke-width="8" stroke-linecap="round"
          transform="rotate(-60 50 50)" />
    <line x1="50" y1="50" x2="50" y2="24" stroke="#000000" stroke-width="8" stroke-linecap="round"
          transform="rotate(60 50 50)" />
    <circle cx="50" cy="50" r="5" fill="#000000" />
</svg>
