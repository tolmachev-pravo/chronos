  <text x="134" y="209" font-size="13" font-weight="600" fill="#1F2430">0.95 MB</text>

  <!-- Callout chips -->
  <rect x="28" y="248" width="156" height="30" rx="15" fill="#E3F8F2"/>
  <text x="106" y="268" font-size="13" font-weight="600" fill="#0E9E82" text-anchor="middle">≈ 15× быстрее</text>

  <rect x="196" y="248" width="236" height="30" rx="15" fill="#EEE9FB"/>
  <text x="314" y="268" font-size="13" font-weight="600" fill="#6A45C9" text-anchor="middle">≈ 900× меньше памяти</text>
