# The Chronos site for the shared nginx from deploy/edge. Copy into its sites folder as
# chronos.conf, put the real host name into server_name, then reload nginx:
#
#   cp chronos.edge.conf ~/edge/sites/chronos.conf
#   docker exec edge-nginx nginx -t && docker exec edge-nginx nginx -s reload

server {
    listen 443 ssl;
    server_name chronos.example.com;

    location / {
        # "chronos" is the container name from docker-compose.yml, reached over network "edge".
        set $upstream http://chronos:8080;
        proxy_pass $upstream;
        # Includes the WebSocket upgrade: Blazor Server lives on one.
        include /etc/nginx/snippets/proxy.conf;
    }
}
