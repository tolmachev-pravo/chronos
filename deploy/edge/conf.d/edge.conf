# Settings every site behind this nginx shares. A site file in ../sites only says which host
# name goes to which container (see ../sites/example.conf.sample).

# TLS for the hop from the load balancer (or the browser, without one). One certificate for
# every site, made by ../make-cert.sh.
ssl_certificate     /etc/nginx/certs/edge.crt;
ssl_certificate_key /etc/nginx/certs/edge.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;

# The real client address. A load balancer in front puts it into X-Forwarded-For; nginx trusts
# that header only from private addresses, where such a balancer lives.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# WebSocket upgrade for the sites that need it (Blazor Server, SignalR, ...).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's DNS. Sites name their container in a variable, so nginx looks it up on each request
# rather than once at start: a stopped application makes only its own site fail, instead of
# stopping nginx from starting or reloading for everyone.
resolver 127.0.0.11 valid=10s ipv6=off;

client_max_body_size 50m;
server_tokens off;

# A host name no site claims gets 404 instead of whichever site happens to be first.
server {
    listen 443 ssl default_server;
    server_name _;
    return 404;
}

include /etc/nginx/sites/*.conf;
